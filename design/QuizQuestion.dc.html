<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Karla:wght@400;500;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap">
  <style>
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;background:#0b0812;color:#f4eef7;font-family:'Spectral',Georgia,serif;line-height:1.5}
    h1,h2{font-family:'Cinzel',Georgia,serif;font-weight:600;margin:0;line-height:1.22;letter-spacing:.02em}
    p{margin:0}
    .u{font-family:'Karla',system-ui,sans-serif}
    .eyebrow{font-family:'Karla',system-ui,sans-serif;text-transform:uppercase;letter-spacing:.18em;font-size:10.5px;color:#cbb2ea}
  </style>
</helmet>

<div style="width:390px;min-height:820px;margin:0 auto;position:relative;overflow:hidden;display:flex;flex-direction:column;background-color:#0b0812;background-image:radial-gradient(circle at 50% -6%,rgba(124,92,255,.2),transparent 46%),radial-gradient(1.4px 1.4px at 330px 80px,rgba(217,180,106,.8),transparent),radial-gradient(1px 1px at 50px 160px,rgba(244,238,247,.45),transparent)">

  <!-- top -->
  <div style="padding:16px 20px 0">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <span class="u" style="font-size:12px;color:#a99fb8">What kind of Scorpio are you?</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6f6480" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div style="flex:1;height:6px;background:#201830;border-radius:99px"><div style="width:50%;height:100%;background:linear-gradient(90deg,#7c5cff,#c02a4a);border-radius:99px"></div></div>
      <span class="u" style="font-size:11px;color:#8a7fa0;white-space:nowrap">3 / 6</span>
    </div>
  </div>

  <!-- question -->
  <div style="padding:30px 24px 8px">
    <p class="eyebrow" style="margin-bottom:14px">Question 3</p>
    <h1 style="font-size:24px;color:#f7f2fb">Someone betrays your trust. Your first real move is —</h1>
  </div>

  <!-- options -->
  <div style="display:flex;flex-direction:column;gap:11px;padding:16px 20px 0">
    <div class="u" style="min-height:52px;display:flex;align-items:center;gap:12px;padding:12px 16px;background:#141020;border:1px solid #241b33;border-radius:14px;font-size:14px;color:#d6cce2">
      <span style="width:22px;height:22px;border-radius:50%;border:1.5px solid #3a2f48;flex-shrink:0"></span>Cut them off cleanly. No speech.
    </div>
    <div class="u" style="min-height:52px;display:flex;align-items:center;gap:12px;padding:12px 16px;background:#1e1636;border:1.5px solid #7c5cff;border-radius:14px;font-size:14px;color:#f4eef7;box-shadow:0 0 20px rgba(124,92,255,.25)">
      <span style="width:22px;height:22px;border-radius:50%;background:#7c5cff;flex-shrink:0;display:flex;align-items:center;justify-content:center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0b0812" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>
      Watch. Learn exactly who they are. Decide later.
    </div>
    <div class="u" style="min-height:52px;display:flex;align-items:center;gap:12px;padding:12px 16px;background:#141020;border:1px solid #241b33;border-radius:14px;font-size:14px;color:#d6cce2">
      <span style="width:22px;height:22px;border-radius:50%;border:1.5px solid #3a2f48;flex-shrink:0"></span>Confront them directly, that night.
    </div>
    <div class="u" style="min-height:52px;display:flex;align-items:center;gap:12px;padding:12px 16px;background:#141020;border:1px solid #241b33;border-radius:14px;font-size:14px;color:#d6cce2">
      <span style="width:22px;height:22px;border-radius:50%;border:1.5px solid #3a2f48;flex-shrink:0"></span>Forgive fast — but never forget it.
    </div>
  </div>

  <div style="margin-top:auto;display:flex;gap:10px;padding:20px">
    <button class="u" style="width:52px;min-height:50px;background:transparent;border:1px solid #3a2f48;border-radius:999px;color:#a99fb8;display:flex;align-items:center;justify-content:center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a99fb8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <button class="u" style="flex:1;min-height:50px;background:#c02a4a;color:#fff;border:none;border-radius:999px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px">Next
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>

</div>
</x-dc>
</body>
</html>
